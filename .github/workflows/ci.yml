name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python backend was retired from the default runtime in favour of the
  # native Rust runner (`core-rs/` + `apps/desktop/src-tauri/src/runner.rs`).
  # Python code lives in `split-python/` locally, gitignored — fresh clones
  # don't have it, so there's nothing for CI to lint or test on that side.
  # The `desktop` job below is the whole pipeline; it runs on macOS (the
  # shipping platform) AND Windows (compile + test coverage for the
  # cross-platform port — runtime there is not yet exercised by CI).

  desktop:
    name: Desktop (Tauri + React) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build frontend (tsc + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Lint (clippy — workspace, all targets)
        working-directory: ${{ github.workspace }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check (workspace)
        working-directory: ${{ github.workspace }}
        run: cargo check --workspace
      - name: Rust unit tests (split-core)
        working-directory: ${{ github.workspace }}
        run: cargo test --workspace --quiet
