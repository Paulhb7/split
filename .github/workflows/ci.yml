name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine (split/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install deps (uv sync)
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check split tests
      - name: Compile
        run: uv run python -m py_compile split/*.py
      - name: Import smoke (loads config registries)
        run: uv run python -c "from split import core; print(len(core.load_harnesses()), 'harnesses,', len(core.load_experts()), 'experts')"
      - name: Unit tests (pytest)
        run: uv run pytest -q

  desktop:
    name: Desktop (Tauri + React)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build frontend (tsc + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Lint (clippy)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo check (Tauri crate)
        working-directory: apps/desktop/src-tauri
        run: cargo check
