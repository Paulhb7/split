<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd000"/><stop offset="0.55" stop-color="#ff7a5c"/><stop offset="1" stop-color="#ff3df2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="louvres">
      <circle cx="160" cy="160" r="100" fill="#fff"/>
      <rect x="50" y="118" width="220" height="4"  fill="#000"/>
      <rect x="50" y="136" width="220" height="6"  fill="#000"/>
      <rect x="50" y="156" width="220" height="8"  fill="#000"/>
      <rect x="50" y="178" width="220" height="10" fill="#000"/>
      <rect x="50" y="202" width="220" height="60" fill="#000"/>
    </mask>
  </defs>
  <g opacity="0.2">
    <g filter="url(#glow)">
      <circle cx="160" cy="160" r="100" fill="url(#sun)" mask="url(#louvres)"/>
    </g>
    <g stroke="#00ffd1" stroke-width="1">
      <line x1="160" y1="196" x2="-40" y2="300" opacity="0.22"/>
      <line x1="160" y1="196" x2="40"  y2="300" opacity="0.26"/>
      <line x1="160" y1="196" x2="110" y2="300" opacity="0.3"/>
      <line x1="160" y1="196" x2="160" y2="300" opacity="0.3"/>
      <line x1="160" y1="196" x2="210" y2="300" opacity="0.3"/>
      <line x1="160" y1="196" x2="280" y2="300" opacity="0.26"/>
      <line x1="160" y1="196" x2="360" y2="300" opacity="0.22"/>
      <line x1="0" y1="204" x2="320" y2="204" opacity="0.18"/>
      <line x1="0" y1="216" x2="320" y2="216" opacity="0.24"/>
      <line x1="0" y1="234" x2="320" y2="234" opacity="0.3"/>
      <line x1="0" y1="260" x2="320" y2="260" opacity="0.36"/>
      <line x1="0" y1="294" x2="320" y2="294" opacity="0.4"/>
    </g>
    <g filter="url(#glow)" opacity="0.35">
      <rect x="120" y="208" width="80" height="3" fill="#ff3df2"/>
      <rect x="132" y="222" width="56" height="2.5" fill="#ff3df2"/>
      <rect x="142" y="240" width="36" height="2" fill="#ff3df2"/>
    </g>
  </g>
</svg>
