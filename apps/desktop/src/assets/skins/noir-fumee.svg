<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 250" fill="none">
  <defs>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="ember" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- volute de fumée depuis le cendrier -->
  <g opacity="0.45">
    <path d="M 62 234 C 56 212, 74 200, 66 178 C 59 158, 78 146, 71 124 C 66 108, 80 98, 76 80 C 72 64, 84 52, 80 34"
          stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.40" filter="url(#haze)"/>
    <path d="M 64 232 C 60 216, 72 206, 67 188 C 63 172, 75 162, 71 144 C 68 130, 78 122, 75 106"
          stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.25" filter="url(#haze)"/>
    <!-- braise + cigarette -->
    <circle cx="62" cy="237" r="1.7" fill="#ffffff" opacity="0.9" filter="url(#ember)"/>
    <line x1="50" y1="240" x2="72" y2="237" stroke="#ffffff" stroke-width="2.2" opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
