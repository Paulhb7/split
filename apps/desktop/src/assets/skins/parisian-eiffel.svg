<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" fill="none">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1830"/><stop offset="1" stop-color="#0d0512"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5cf95"/><stop offset="0.5" stop-color="#d4a574"/><stop offset="1" stop-color="#8a6740"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#fff5dc"/><stop offset="1" stop-color="#d4b690"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a0a18" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g opacity="0.42">
    <!-- lune basse -->
    <circle cx="76" cy="48" r="13" fill="url(#moon)" opacity="0.7" filter="url(#glow)"/>
    <!-- nuée d'oiseaux, bande rose -->
    <g stroke="#f3e6ce" stroke-width="1.1" stroke-linecap="round" opacity="0.32">
      <path d="M118 98 q 4 -3 8 0 q 4 -3 8 0"/>
      <path d="M148 110 q 3.5 -2.5 7 0 q 3.5 -2.5 7 0"/>
      <path d="M414 68 q 4 -3 8 0 q 4 -3 8 0"/>
      <path d="M432 84 q 3.5 -2.5 7 0 q 3.5 -2.5 7 0"/>
    </g>
    <!-- toits Haussmann · plan lointain -->
    <g fill="#2a1928" opacity="0.7" filter="url(#soft)">
      <path d="M0 168 L 0 142 L 22 142 L 28 130 L 56 130 L 62 142 L 84 142 L 84 168 Z"/>
      <path d="M70 168 L 70 138 L 100 138 L 106 124 L 138 124 L 144 138 L 174 138 L 174 168 Z"/>
      <path d="M186 168 L 186 140 L 210 140 L 216 127 L 246 127 L 252 140 L 276 140 L 276 168 Z"/>
      <path d="M286 168 L 286 142 L 314 142 L 320 130 L 348 130 L 354 142 L 376 142 L 376 168 Z"/>
      <path d="M362 168 L 362 138 L 392 138 L 398 124 L 430 124 L 436 138 L 460 138 L 460 168 Z"/>
    </g>
    <!-- la Tour Eiffel · décentrée à droite (x ≈ 74 %) -->
    <g transform="translate(110 0)">
      <g fill="url(#iron)" filter="url(#sh)">
        <path d="M 188 180 L 216 124 L 222 124 L 220 180 Z"/>
        <path d="M 272 180 L 244 124 L 238 124 L 240 180 Z"/>
        <path d="M 220 180 C 217 162, 220 144, 226 130 L 226 180 Z"/>
        <path d="M 240 180 C 243 162, 240 144, 234 130 L 234 180 Z"/>
        <rect x="212" y="120" width="36" height="4" rx="0.5"/>
        <path d="M 219 120 L 223 84 L 237 84 L 241 120 Z"/>
        <rect x="220" y="81" width="20" height="3" rx="0.5"/>
        <path d="M 224 81 L 226 44 L 234 44 L 236 81 Z"/>
        <rect x="225" y="42" width="10" height="2.2" rx="0.4"/>
        <path d="M 227 42 L 228.5 22 L 231.5 22 L 233 42 Z"/>
      </g>
      <!-- antenne et phare (pulse SMIL — statique si non supporté en background) -->
      <line x1="230" y1="22" x2="230" y2="9" stroke="#1a1322" stroke-width="1.4"/>
      <circle cx="230" cy="8" r="3.5" fill="#f5cf95" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <!-- treillis en fil d'or -->
      <g stroke="url(#gold)" stroke-width="0.65" opacity="0.75">
        <line x1="194" y1="172" x2="216" y2="124"/>
        <line x1="266" y1="172" x2="244" y2="124"/>
        <line x1="220" y1="118" x2="240" y2="86"/>
        <line x1="240" y1="118" x2="220" y2="86"/>
        <line x1="225" y1="80" x2="235" y2="46"/>
        <line x1="235" y1="80" x2="225" y2="46"/>
      </g>
      <!-- fenêtres dorées aux trois étages -->
      <g fill="#f5cf95" opacity="0.9" filter="url(#glow)">
        <circle cx="220" cy="122" r="1.8"/><circle cx="226" cy="122" r="1.8"/>
        <circle cx="234" cy="122" r="1.8"/><circle cx="240" cy="122" r="1.8"/>
        <circle cx="226" cy="82.5" r="1.5"/><circle cx="234" cy="82.5" r="1.5"/>
        <circle cx="228.5" cy="43" r="1.2"/><circle cx="231.5" cy="43" r="1.2"/>
      </g>
    </g>
    <!-- toits Haussmann · premier plan, percée au pied de la Tour -->
    <g fill="#160b1f" opacity="0.96" filter="url(#sh)">
      <path d="M0 200 L 0 156 L 34 156 L 40 138 L 84 138 L 90 156 L 130 156 L 130 200 Z"/>
      <path d="M118 200 L 118 152 L 154 152 L 160 136 L 196 136 L 202 152 L 214 152 L 214 200 Z"/>
      <path d="M204 200 L 204 152 L 216 152 L 222 136 L 258 136 L 264 152 L 288 152 L 288 200 Z"/>
      <path d="M386 200 L 386 156 L 410 156 L 416 138 L 444 138 L 450 156 L 460 156 L 460 200 Z"/>
    </g>
    <!-- cheminées de zinc -->
    <g fill="#160b1f" opacity="0.95">
      <rect x="18" y="148" width="3.5" height="9"/>
      <rect x="58" y="130" width="3.5" height="10"/>
      <rect x="106" y="146" width="3.5" height="9"/>
      <rect x="172" y="128" width="3.5" height="10"/>
      <rect x="236" y="128" width="3.5" height="10"/>
      <rect x="272" y="146" width="3.5" height="9"/>
      <rect x="420" y="130" width="3.5" height="10"/>
      <rect x="448" y="148" width="3.5" height="9"/>
    </g>
    <!-- fenêtres allumées des immeubles -->
    <g fill="#f5cf95" opacity="0.95" filter="url(#glow)">
      <rect x="12"  y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="24"  y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="50"  y="174" width="3.2" height="4" rx="0.5"/>
      <rect x="74"  y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="102" y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="148" y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="178" y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="212" y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="232" y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="252" y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="276" y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="396" y="172" width="3.2" height="4" rx="0.5"/>
      <rect x="424" y="169" width="3.2" height="4" rx="0.5"/>
      <rect x="446" y="172" width="3.2" height="4" rx="0.5"/>
    </g>
    <!-- reflets dorés dans la percée -->
    <g stroke="#d4a574" stroke-linecap="round" stroke-width="0.9" opacity="0.3">
      <line x1="300" y1="186" x2="378" y2="186"/>
      <line x1="312" y1="191" x2="366" y2="191"/>
    </g>
  </g>
</svg>
