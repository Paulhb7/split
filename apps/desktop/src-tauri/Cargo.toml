[package]
name = "acp-desktop"
version = "0.1.0"
description = "Split — ACP agent league (Tauri)"
authors = ["Paul Barbaste"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "acp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
