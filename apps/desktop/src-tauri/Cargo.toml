[package]
name = "split-desktop"
version = "0.1.0"
# Two binaries live here (the app + the fake ACP agent used by the
# integration tests) — `tauri dev`'s bare `cargo run` needs the tiebreak.
default-run = "split-desktop"
description = "Split — ACP agent league (Tauri)"
authors = ["Paul Barbaste"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "split_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` lets the WKWebView itself be transparent, which is what
# allows the NSVisualEffectView vibrancy layer (lib.rs) to show through the
# skins' translucent gradient stacks. Paired with `macOSPrivateApi: true` +
# `transparent: true` in tauri.conf.json.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# Native file dialogs (save / open picker) for the artifact-rail "Save a copy…"
# button. Cross-platform — wraps NSSavePanel on macOS, IFileDialog on Windows,
# xdg-portal/zenity on Linux.
tauri-plugin-dialog = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform secret storage: macOS Keychain, Windows Credential Manager,
# Linux Secret Service. Same Rust API, three backends — we get Windows / Linux
# portability for free even though the rest of the app is macOS-only today.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Agent Client Protocol — the canonical Rust SDK (maintained by the
# `agentclientprotocol` org, the same governance that ships the spec). We
# enable `unstable` to access session/resume + session/close + logout +
# set_config_option + the rest of the stabilised-but-still-gated methods.
agent-client-protocol = { version = "0.13", features = ["unstable"] }
# Async runtime for the per-session task. Tauri 2 already pulls tokio; we
# pin the features the runner needs (mpsc channels, multi-thread RT, macros).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Split's portable engine — persona projection, session archive, permission
# rules, harness model config. Same surface as `split/core.py` +
# `split/permissions.py` so the Rust runner reaches parity with the Python
# runner. Lives in the workspace as a path crate.
split-core = { path = "../../../core-rs" }
# Inline image / PDF artifact bytes for the React viewer as data URLs.
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Native notifications with an actionable "Open" button + click response
# (`notify_turn_done` in lib.rs). Chosen over the tauri notification plugins:
# the official one is display-only on desktop (actions are mobile-only), and
# the community UNUserNotificationCenter one ships Swift typed-throws sources
# that require Xcode 16 / Swift 6 to build. This crate is pure ObjC bindings
# (NSUserNotification — deprecated but still delivered on Sonoma/Sequoia),
# needs no Swift toolchain, and works from the unbundled `tauri dev` binary
# (it swizzles the bundle identity — dev banners show as Terminal).
mac-notification-sys = "0.6"
# Native PDF export. WKWebView ignores the JS `window.print()` path entirely,
# so "Export as PDF" renders through the webview's own `createPDF` API on a
# hidden window. These objc2 crates are already in the tree (pulled by wry), so
# pinning them as direct deps adds no new build — just the bindings we call.
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigation", "WKPDFConfiguration", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
block2 = "0.6"
