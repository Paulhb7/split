[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "split-acp"
version = "0.1.0"
description = "Split — many experts in parallel over the Agent Client Protocol (ACP)"
license = "Apache-2.0"
authors = [{ name = "Paul Barbaste" }]
requires-python = ">=3.10"
dependencies = [
  "agent-client-protocol==0.10.0",
  "python-dotenv>=1.0",
]

# Dev/test tools — `uv sync` installs this group by default.
[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools]
packages = ["split"]

[tool.pytest.ini_options]
pythonpath = ["."]      # so `from split import core` resolves from the repo root
testpaths = ["tests"]
